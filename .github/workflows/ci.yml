name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  # Defaults for elite-choir-53kqt — override via GitHub Actions variables
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'elite-choir-53kqt' }}
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  GAR_LOCATION: ${{ vars.GCP_AR_LOCATION || 'us-central1' }}
  REPOSITORY: ${{ vars.GCP_AR_REPOSITORY || 'portfolio' }}
  SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'sufyan-portfolio' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production dependency audit
        run: npm run security:audit

      - name: Production build
        run: npm run build

  deploy:
    name: Deploy Cloud Run
    needs: verify
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      vars.ENABLE_CLOUD_RUN_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity)
        id: auth
        if: ${{ vars.WIF_PROVIDER != '' && vars.WIF_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Authenticate to Google Cloud (SA JSON fallback)
        id: auth_json
        if: ${{ steps.auth.outcome != 'success' && secrets.GCP_SA_KEY != '' }}
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Require GCP auth
        if: ${{ steps.auth.outcome != 'success' && steps.auth_json.outcome != 'success' }}
        run: |
          echo "::error::Set GitHub variables WIF_PROVIDER + WIF_SERVICE_ACCOUNT (preferred), or secret GCP_SA_KEY. Run scripts/setup-cloud-run-ci.sh after gcloud auth login."
          exit 1

      - name: Docker auth to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GAR_LOCATION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token || steps.auth_json.outputs.access_token }}

      - name: Build and push image
        run: |
          IMAGE="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}:${GITHUB_SHA}"
          IMAGE_LATEST="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}:latest"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          docker build \
            -t "$IMAGE" \
            -t "$IMAGE_LATEST" \
            .
          docker push "$IMAGE"
          docker push "$IMAGE_LATEST"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}
          flags: >-
            --allow-unauthenticated
            --port=8080
            --cpu=1
            --memory=512Mi
            --max-instances=3
            --min-instances=0
            --timeout=60
          env_vars: |
            NODE_ENV=production
            APP_URL=https://www.mohammedsufyan.com

      - name: Deployment URL
        run: echo "Deployed to ${{ steps.deploy.outputs.url }}"
