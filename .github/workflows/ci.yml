name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write

env:
  NODE_VERSION: '22'

jobs:
  # ── Gates (each job = its own GitHub check) ─────────────────────────────

  semver-tag:
    name: SemVer tag
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require SemVer bump when version already released
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version.replace(/^v/i,'').trim()")"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::package.json version must be SemVer X.Y.Z (got: ${VERSION})"
            exit 1
          fi
          TAG="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::${TAG} is already released. Bump package.json (and footer version source) before merging."
            exit 1
          fi
          echo "OK: ${TAG} is not released yet — PR may proceed."

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  firestore-rules-lint:
    name: Firestore rules lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint:rules

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:coverage

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run security:audit

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Production build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 2

  csp-headers:
    name: CSP headers smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Assert production security headers
        run: |
          chmod +x scripts/ci-csp-headers-smoke.sh
          npm run ci:csp-smoke

  bundle-size:
    name: Bundle size
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: npm run ci:bundle-size

  playwright:
    name: Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [build]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Install Playwright Chromium + OS deps
        run: npx playwright install --with-deps chromium
      - name: Run Playwright smoke (webServer starts Express)
        env:
          CI: 'true'
          SESSION_SECRET: ci-playwright-session-secret-32chars
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [build]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Install Playwright Chromium for Lighthouse
        run: npx playwright install --with-deps chromium
      - name: Run Lighthouse floors
        env:
          SESSION_SECRET: ci-lighthouse-session-secret-32chars
        run: |
          set -euo pipefail
          CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          export CHROME_PATH
          echo "Using Chrome at: $CHROME_PATH"
          test -x "$CHROME_PATH"
          npm run ci:lighthouse

  firestore-rules-tests:
    name: Firestore rules tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Run rules unit tests (emulator)
        run: npm run test:rules

  gitleaks:
    name: Gitleaks (secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Run Gitleaks (working tree)
        run: |
          set -euo pipefail
          chmod +x scripts/ensure-gitleaks.sh
          GITLEAKS_BIN="$(./scripts/ensure-gitleaks.sh)"
          "${GITLEAKS_BIN}" detect --no-git --source . --verbose --redact --config .gitleaks.toml

  bandit:
    name: Bandit check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Bandit
        run: python -m pip install --upgrade pip bandit
      - name: Bandit (Python SAST)
        run: |
          set -euo pipefail
          py_files=()
          while IFS= read -r f; do
            py_files+=("$f")
          done < <(git ls-files '*.py')
          if [ "${#py_files[@]}" -eq 0 ]; then
            echo "No tracked Python sources; Bandit Python scan skipped."
            exit 0
          fi
          bandit -ll -r "${py_files[@]}"

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Semgrep
        run: python -m pip install --upgrade pip semgrep
      - name: Semgrep JS/TS SAST
        run: |
          set -euo pipefail
          semgrep scan \
            --config p/javascript \
            --config p/typescript \
            --config p/security-audit \
            --error \
            --exclude=node_modules \
            --exclude=dist \
            --exclude=dev-dist \
            --exclude=coverage \
            --exclude=build \
            --exclude=.tools \
            --exclude=e2e \
            .

  code-guard:
    name: Code Guard check (CodeQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          config-file: ./.github/codeql/codeql-config.yml
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      [
        typecheck,
        unit-tests,
        coverage,
        npm-audit,
        build,
        gitleaks,
        bandit,
        semgrep,
        code-guard,
      ]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image (load locally for scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: sufyan-portfolio:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
            VITE_TURNSTILE_SITE_KEY=${{ secrets.VITE_TURNSTILE_SITE_KEY }}
            VITE_RECAPTCHA_SITE_KEY=${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
      - name: Save image artifact
        run: docker save sufyan-portfolio:ci -o /tmp/sufyan-portfolio-ci.tar
      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/sufyan-portfolio-ci.tar
          retention-days: 1

  trivy:
    name: Trivy scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [docker-build]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp
      - name: Load image
        run: docker load -i /tmp/sufyan-portfolio-ci.tar
      - name: Trivy image scan (CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sufyan-portfolio:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          scanners: vuln,secret,misconfig

  deploy:
    name: Deploy Cloud Run
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Do not need PR-only jobs (semver-tag) — skipped jobs would skip deploy.
    needs:
      [
        typecheck,
        firestore-rules-lint,
        unit-tests,
        coverage,
        npm-audit,
        build,
        csp-headers,
        bundle-size,
        playwright,
        lighthouse,
        firestore-rules-tests,
        gitleaks,
        bandit,
        semgrep,
        code-guard,
        docker-build,
        trivy,
      ]
    environment: production
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, push, and deploy image to Cloud Run
        env:
          PROJECT: ${{ vars.GCP_PROJECT || 'mohammed-sufyan-portfolio' }}
          REGION: ${{ vars.GCP_REGION || 'us-central1' }}
          SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'mohammed-sufyan-portfolio' }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
        run: |
          set -euo pipefail
          : "${VITE_FIREBASE_API_KEY:?VITE_FIREBASE_API_KEY secret is required for production builds}"
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT}/cloud-run-source-deploy/${SERVICE}:${GITHUB_SHA}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build \
            --platform=linux/amd64 \
            --build-arg "VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}" \
            --build-arg "VITE_TURNSTILE_SITE_KEY=${VITE_TURNSTILE_SITE_KEY}" \
            --build-arg "VITE_RECAPTCHA_SITE_KEY=${VITE_RECAPTCHA_SITE_KEY}" \
            -t "$IMAGE" .
          docker push "$IMAGE"
          gcloud run deploy "$SERVICE" \
            --project="$PROJECT" \
            --region="$REGION" \
            --image="$IMAGE" \
            --quiet

      - name: Post-deploy smoke
        env:
          PROJECT: ${{ vars.GCP_PROJECT || 'mohammed-sufyan-portfolio' }}
          REGION: ${{ vars.GCP_REGION || 'us-central1' }}
          SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'mohammed-sufyan-portfolio' }}
        run: |
          set -euo pipefail
          BASE_URL="$(gcloud run services describe "$SERVICE" \
            --project="$PROJECT" \
            --region="$REGION" \
            --format='value(status.url)')"
          : "${BASE_URL:?Cloud Run service URL missing}"
          export BASE_URL
          echo "Smoke base URL: $BASE_URL"
          sleep 10

          curl -sS --fail "$BASE_URL/api/uptime" | tee /tmp/uptime.json
          curl -sS --fail "$BASE_URL/api/health" | tee /tmp/health.json
          curl -sS --fail "$BASE_URL/api/status" | tee /tmp/status.json
          curl -sS --fail "$BASE_URL/api/chat/status" | tee /tmp/chat-status.json

          HTML="$(curl -sS --fail "$BASE_URL/")"
          printf '%s' "$HTML" > /tmp/index.html
          python3 - <<'PY'
          import os, pathlib, re, urllib.request
          html = pathlib.Path("/tmp/index.html").read_text()
          m = re.search(r'src="(/assets/[^"]+\.js)"', html)
          assert m, "main JS asset missing from index HTML"
          base = os.environ["BASE_URL"].rstrip("/")
          js = urllib.request.urlopen(base + m.group(1), timeout=60).read().decode()
          if not re.search(r'apiKey:(?:`AIza|"AIza)', js):
              raise SystemExit("Production bundle is missing an inlined Firebase apiKey (AIza…)")
          print("OK: Firebase apiKey present in SPA bundle")
          PY

          python3 - <<'PY'
          import json

          def load(path):
            with open(path) as f:
              return json.load(f)

          uptime = load("/tmp/uptime.json")
          health = load("/tmp/health.json")
          status = load("/tmp/status.json")
          chat = load("/tmp/chat-status.json")

          assert uptime.get("ok") is True, uptime
          assert health.get("ok") is True, health
          assert health.get("sessionSecretConfigured") is True, health
          assert health.get("turnstileConfigured") is True, health
          assert health.get("distributedStore") == "redis", health
          assert status.get("ok") is True, status
          assert status.get("controls", {}).get("sessionSecret") is True, status
          assert status.get("controls", {}).get("turnstile") is True, status
          assert status.get("controls", {}).get("redis") is True, status
          assert chat.get("ok") is True, chat
          assert isinstance(health.get("version"), str) and health["version"], health
          assert str(health.get("versionLabel", "")).startswith("v"), health
          assert status.get("version") == health.get("version"), (status, health)

          print("smoke ok", {
            "version": health.get("versionLabel"),
            "uptime": uptime.get("ok"),
            "health": health.get("status"),
            "goldPath": health.get("goldPath"),
            "chat": {k: chat.get(k) for k in ("ok", "enabled", "llmConfigured", "vectorConfigured")},
            "controls": status.get("controls"),
          })
          PY

      - name: Publish GitHub Release for package.json version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version.replace(/^v/i,'').trim()")"
          TAG="v${VERSION}"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists on origin."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "Portfolio site ${TAG} (post-deploy)"
            git push origin "refs/tags/${TAG}"
            echo "Created and pushed ${TAG}."
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG} already exists."
          else
            sleep 2
            gh release create "${TAG}" \
              --title "Portfolio ${TAG}" \
              --notes "Production release ${TAG} after successful Cloud Run deploy + smoke." \
              --verify-tag \
              || gh release view "${TAG}" >/dev/null
            echo "GitHub Release ${TAG} is published."
          fi
