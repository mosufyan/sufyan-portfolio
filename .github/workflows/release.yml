name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          NOTES="$(git tag -l --format='%(contents)' "$TAG" | sed '/^$/d' | head -20)"
          if [[ -z "$NOTES" ]]; then
            NOTES="Portfolio site release ${TAG}"
          fi
          gh release create "$TAG" \
            --title "Portfolio ${TAG}" \
            --notes "$NOTES" \
            --verify-tag
