    <script>
      (function () {
        try {
          var root = document.documentElement;
          var t = localStorage.getItem('portfolio-site-theme');
          if (t === 'light' || t === 'dark') {
            root.setAttribute('data-theme', t);
            root.classList.toggle('dark', t === 'dark');
            root.classList.toggle('light', t === 'light');
          }
          var a = localStorage.getItem('portfolio-site-accent');
          if (a === 'cyan' || a === 'amber') {
            root.setAttribute('data-accent', a);
          } else {
            root.setAttribute('data-accent', 'cyan');
            a = 'cyan';
          }
          var fav = document.querySelector('link[data-brand-favicon="svg"]');
          if (fav) {
            fav.setAttribute(
              'href',
              (a === 'amber' ? '/icon-amber.svg' : '/icon.svg') + '?v=1.1.26'
            );
          }
        } catch (e) {}
      })();
    </script>
